name: Build & offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Engine/package-lock.json
      - run: npm ci --prefix Engine --ignore-scripts
      - run: npm test --prefix Engine
      - run: swift test --package-path Packages/EditorInteractionKit
      - run: python3 -m unittest discover -s server -p 'test_*.py'
      - run: python3 scripts/check-public.py
      - run: brew install xcodegen
      - run: ./scripts/build.sh
